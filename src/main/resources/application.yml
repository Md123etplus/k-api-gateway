server:
  port: 8080  # Gateway runs on port 8080

spring:
  application:
    name: api-gateway  # Name in Eureka
  cloud:
    gateway:
      routes:
        - id: user-service  # Route ID (can be anything)
          uri: lb://user-service  # "lb" = load balance via Eureka
          predicates:
            - Path=/api/users/**  # Routes "/api/users/*" to user-service
          filters:
            - StripPrefix=1  # Removes "/api" prefix

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Register with Eureka

